<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background-color:#0a0e17;font-family:'Courier New',Courier,monospace;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#0a0e17;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="560" cellpadding="0" cellspacing="0" style="background-color:#0d1117;border:1px solid rgba(163,230,53,0.2);border-radius:8px;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td style="padding:24px 32px;border-bottom:1px solid rgba(255,255,255,0.05);">
              <span style="color:#a3e635;font-weight:bold;letter-spacing:4px;font-size:14px;">EDULINUX</span>
            </td>
          </tr>

          <!-- Prompt line -->
          <tr>
            <td style="padding:32px 32px 0 32px;">
              <span style="color:#4b5563;font-size:12px;">root@edulinux:~$</span>
              <span style="color:#a3e635;font-size:12px;margin-left:8px;">confirm --account {{ .Email }}</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:24px 32px;">
              <p style="color:#ffffff;font-size:15px;line-height:1.6;margin:0 0 8px 0;">Bienvenue sur <strong style="color:#a3e635;">EduLinux</strong>.</p>
              <p style="color:#9ca3af;font-size:14px;line-height:1.6;margin:0 0 24px 0;">Confirme ton adresse email pour activer ton compte et sauvegarder ta progression.</p>

              <!-- CTA Button -->
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:4px;background-color:#a3e635;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 28px;color:#000000;font-weight:bold;font-size:13px;text-decoration:none;letter-spacing:1px;font-family:'Courier New',Courier,monospace;">
                      CONFIRMER MON COMPTE →
                    </a>
                  </td>
                </tr>
              </table>

              <p style="color:#4b5563;font-size:12px;margin:24px 0 0 0;">
                Lien valable 24h. Si tu n'as pas créé de compte, ignore cet email.
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:16px 32px;border-top:1px solid rgba(255,255,255,0.05);">
              <p style="color:#374151;font-size:11px;margin:0;">
                © EduLinux — <a href="https://edulinux.fr" style="color:#4b5563;text-decoration:none;">edulinux.fr</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
