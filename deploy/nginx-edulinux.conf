# ─── SANS DOMAINE (IP uniquement — pour tester) ────────────────────────────────
# Utilise ce bloc tant que tu n'as pas de domaine.
# Dès que tu as un domaine : remplace server_name par ton domaine et lance certbot.

server {
    listen 80;
    listen [::]:80;
    server_name _;   # répond à toutes les requêtes (IP ou domaine)

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

